services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env
     #HOST:CONTAINER
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      
    env_file:
      - .env
    #HOST:CONTAINER
    ports:
      - "8000:8000"
    #Käynnistää db ennen api 
    depends_on:
      - db

volumes:
  pgdata:
