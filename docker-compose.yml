services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

     #HOST:CONTAINER
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile

    env_file:
      - .env
    
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    #HOST:CONTAINER
    ports:
      - "8000:8000"
    #api riippuvainen servicehealthy
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
